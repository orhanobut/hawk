buildscript {
  repositories {
    // Google Maven mirror (dl.google.com can be unreachable from some networks).
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:9.3.0'
  }
}

allprojects {
  repositories {
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
  }
}

subprojects { project ->
  group = GROUP
  version = VERSION_NAME

  apply plugin: 'checkstyle'

  task checkstyle(type: Checkstyle) {
    configFile rootProject.file('checkstyle.xml')
    source 'src/main/java'
    ignoreFailures false
    showViolations true
    include '**/*.java'

    classpath = files()
  }

  afterEvaluate {
    if (project.tasks.findByName('check')) {
      check.dependsOn('checkstyle')
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}

ext {
  minSdkVersion = 21
  targetSdkVersion = 36
  compileSdkVersion = 36
  sourceCompatibilityVersion = JavaVersion.VERSION_1_8
  targetCompatibilityVersion = JavaVersion.VERSION_1_8
}

ext.deps = [
    gson          : 'com.google.code.gson:gson:2.13.2',
    datastorePrefs: 'androidx.datastore:datastore-preferences:1.1.7',
    coroutines    : 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0',

    // Test dependencies
    junit         : 'junit:junit:4.13.2',
    truth         : 'com.google.truth:truth:1.4.5',
    robolectric   : 'org.robolectric:robolectric:4.16.1',
    mockito       : 'org.mockito:mockito-core:5.23.0',
    espressoRunner: 'androidx.test:runner:1.6.2',
    espressoRules : 'androidx.test:rules:1.6.1',
    kotlin        : 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'

]
