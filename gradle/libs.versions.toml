[versions]
agp = "9.4.1"
kotlin = "2.4.20"
gson = "2.14.0"
conceal = "2.0.2"
junit = "4.13.2"
runner = "1.7.0"
androidx-junit = "1.3.0"
maven-publish = "0.37.0"
dokka = "2.2.0"
compile-sdk = "37"
min-sdk = "21"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
conceal = { module = "com.facebook.conceal:conceal", version.ref = "conceal" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
